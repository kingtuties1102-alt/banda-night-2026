<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — Banda Night</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Raleway', sans-serif;
      background: #0a0020;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .card {
      border: 1px solid rgba(155,48,255,0.3);
      border-radius: 4px;
      padding: 3rem;
      max-width: 460px;
      background: rgba(10,0,32,0.9);
      box-shadow: 0 0 40px rgba(155,48,255,0.2);
    }
    h1 { font-family: 'Dancing Script', cursive; font-size: 2.5rem; margin-bottom: 1rem; text-shadow: 0 0 20px rgba(199,125,255,0.4); }
    p { color: rgba(255,255,255,0.6); margin-bottom: 1.5rem; }
    .spinner { display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(155,48,255,0.2); border-top-color: #9b30ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .qr-box { background: white; border-radius: 8px; padding: 1.25rem; display: inline-block; margin: 1rem 0; box-shadow: 0 0 30px rgba(155,48,255,0.3); }
    .qr-box img { width: 240px; height: 240px; }
    .ticket-info { text-align: left; background: rgba(155,48,255,0.06); border: 1px solid rgba(155,48,255,0.15); border-radius: 4px; padding: 1rem 1.25rem; margin: 1rem 0; }
    .info-row { display: flex; justify-content: space-between; padding: 0.35rem 0; font-size: 0.85rem; }
    .info-row .lbl { color: #c77dff; }
    .info-row .val { font-weight: 600; }
    .btn { display: inline-block; margin-top: 1rem; padding: 0.8rem 2rem; border: 1px solid #c77dff; background: transparent; color: white; font-family: 'Raleway', sans-serif; font-weight: 600; letter-spacing: 2px; cursor: pointer; text-decoration: none; transition: all 0.3s ease; }
    .btn:hover { background: #9b30ff; box-shadow: 0 0 20px rgba(155,48,255,0.4); }
    .btn-save { background: #ffd700; color: #0a0020; border-color: #ffd700; margin-right: 0.5rem; }
    .btn-save:hover { box-shadow: 0 0 20px rgba(255,215,0,0.4); background: #ffe066; }
    #content { display: none; }
    #loading { display: block; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <div id="loading">
      <div class="spinner"></div>
      <h1>Processing Payment...</h1>
      <p>Verifying your ticket, one moment...</p>
    </div>

    <div id="content">
      <h1 id="statusTitle">🎉 You're In!</h1>
      <p id="statusMsg">Your ticket to Banda Night is confirmed.</p>
      <div class="qr-box" id="qrBox" style="display:none;">
        <img id="ticketQR" src="" alt="QR Code">
      </div>
      <div class="ticket-info" id="ticketInfo" style="display:none;">
        <div class="info-row"><span class="lbl">Name</span><span class="val" id="tName">—</span></div>
        <div class="info-row"><span class="lbl">Tier</span><span class="val" id="tTier">—</span></div>
        <div class="info-row"><span class="lbl">Price</span><span class="val" id="tPrice">—</span></div>
        <div class="info-row"><span class="lbl">Ticket ID</span><span class="val" id="tId" style="font-size:0.7rem;word-break:break-all;">—</span></div>
      </div>
      <div>
        <button class="btn btn-save" id="saveBtn" style="display:none;" onclick="downloadQR()">📥 Save QR</button>
        <a href="/" class="btn">← Back to Site</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    async function verifyPayment() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');

      if (!sessionId) {
        showError('No session ID found.');
        return;
      }

      try {
        const res = await fetch('/api/verify-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId }),
        });
        const data = await res.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        if (data.success) {
          const t = data.ticket;
          document.getElementById('tName').textContent = t.name;
          document.getElementById('tTier').textContent = t.tier;
          document.getElementById('tPrice').textContent = `$${t.price}`;
          document.getElementById('tId').textContent = t.ticketId;
          document.getElementById('ticketInfo').style.display = 'block';
          document.getElementById('qrBox').style.display = 'inline-block';
          document.getElementById('saveBtn').style.display = 'inline-block';

          const qrData = JSON.stringify({
            ticketId: t.ticketId,
            event: 'Banda Night - Sigma Lambda Beta',
            name: t.name,
            tier: t.tier,
            price: t.price,
          });
          const qrUrl = await QRCode.toDataURL(qrData, {
            width: 400, margin: 2,
            color: { dark: '#0a0020', light: '#ffffff' }
          });
          document.getElementById('ticketQR').src = qrUrl;
        } else {
          showError(data.error || 'Payment was not completed.');
        }
      } catch (err) {
        showError('Could not verify payment. Please contact us.');
      }
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      document.getElementById('statusTitle').textContent = '⚠️ Issue';
      document.getElementById('statusTitle').classList.add('error');
      document.getElementById('statusMsg').textContent = msg;
    }

    function downloadQR() {
      const img = document.getElementById('ticketQR');
      const a = document.createElement('a');
      a.href = img.src;
      a.download = `banda-ticket-${document.getElementById('tId').textContent.slice(0,8)}.png`;
      a.click();
    }

    verifyPayment();
  </script>
</body>
</html>
